
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
            <h3 class="text-center">Forgot Password</h3>
            <p class="text-muted text-center">Enter your email to reset your password</p>
            <form id="password-reset-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
            <div class="text-center mt-3">
                <a href="/templates/base.html" class="text-decoration-none">Back to Login</a>
            </div>
            <div id="message" class="mt-3"></div>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            $('#password-reset-form').on('submit', function (e) {
                e.preventDefault();

                const email = $('#email').val();
                const apiUrl = 'http://localhost:8000/api/password-reset/';

                $.ajax({
                    url: apiUrl,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ email: email }),
                    success: function (response) {
                        $('#message').html('<div class="alert alert-success">A reset link has been sent to your email.</div>');
                    },
                    error: function (xhr) {
                        let errorMessage = 'Something went wrong. Please try again.';
                        if (xhr.status === 400) {
                            const errors = xhr.responseJSON || {};
                            errorMessage = errors.email ? errors.email.join(', ') : 'Invalid email address.';
                        }
                        $('#message').html(`<div class="alert alert-danger">${errorMessage}</div>`);
                    }
                });
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
